<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 1080px;
            height: 1080px;
            background-color: #0d1117;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            padding: 80px;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-radius: 20px;
            background: linear-gradient(135deg, #161b22 0%, #0d1117 100%);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
            padding: 60px;
            box-sizing: border-box;
            border: 1px solid #30363d;
        }

        /* Layout Types */
        .layout-centered_bold { text-align: center; align-items: center; }
        .layout-left_heavy { text-align: left; align-items: flex-start; }
        .layout-centered_action { text-align: center; align-items: center; justify-content: space-evenly;}
        .layout-split_view { text-align: left; align-items: flex-start; justify-content: space-between;}
        .layout-centered_minimal { text-align: center; align-items: center; justify-content: center;}
        
        /* Font Sizes */
        .font-large .headline { font-size: 8rem; line-height: 1.1; font-weight: 800; letter-spacing: -2px;}
        .font-medium .headline { font-size: 6rem; line-height: 1.15; font-weight: 700; letter-spacing: -1px;}
        .font-small .headline { font-size: 4.5rem; line-height: 1.2; font-weight: 700; }

        .headline {
            margin-bottom: 40px;
            background: linear-gradient(to right, #ffffff, #8b949e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtext {
            font-size: 2.5rem;
            color: #8b949e;
            font-weight: 400;
            max-width: 90%;
            line-height: 1.4;
        }
        
        /* Watermark / Brand Footer */
        .footer {
            position: absolute;
            bottom: 60px;
            left: 100px;
            font-size: 1.5rem;
            color: #484f58;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 15px;
        }
    </style>
</head>
<body>
    <div class="container layout-{{LAYOUT}} font-{{FONT_SIZE}}">
        <div class="headline">{{HEADLINE}}</div>
        <div class="subtext">{{SUBTEXT}}</div>
    </div>
    <div class="footer">CreatorPulse AI</div>
    <div id="elements" style="display:none;" data-elements="{{ELEMENTS_META}}"></div>
</body>
</html>
