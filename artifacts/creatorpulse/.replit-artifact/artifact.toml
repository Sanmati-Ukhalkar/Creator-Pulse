kind = "web"
previewPath = "/"
title = "CreatorPulse"
version = "1.0.0"
id = "artifacts/creatorpulse"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18318

[services.development]
run = "pnpm --filter @workspace/creatorpulse run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/creatorpulse", "run", "build" ]
publicDir = "artifacts/creatorpulse/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18318"
BASE_PATH = "/"
